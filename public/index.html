<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room Security Dashboard</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="camera-panel" aria-label="Live camera monitor">
        <div class="topbar">
          <div>
            <p class="eyebrow">Room Security</p>
            <h1>Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <label class="arm-switch">
              <input id="armedToggle" type="checkbox">
              <span class="track" aria-hidden="true"></span>
              <span id="armedLabel">Unarmed</span>
            </label>
            <button id="logoutButton" type="button">Log Out</button>
          </div>
        </div>

        <div class="sensor-panel">
          <div id="systemLight" class="system-light" aria-hidden="true"></div>
          <div>
            <h2 id="systemSummary">System unarmed</h2>
            <p id="systemDetail"></p>
            <div class="sensor-actions">
              <button id="testRecordingButton" type="button">Test Recording</button>
            </div>
          </div>
          <div id="recordingBadge" class="recording-badge" hidden>Recording</div>
        </div>
      </section>

      <aside class="side-panel" aria-label="Security events">
        <div class="status-grid">
          <div>
            <span class="metric-label">Mode</span>
            <strong id="modeMetric">Unarmed</strong>
          </div>
          <div>
            <span class="metric-label">Last Motion Detected</span>
            <strong id="motionMetric">Idle</strong>
          </div>
          <div>
            <span class="metric-label">Time Since Last Restart</span>
            <strong id="uptimeMetric">0d 0h 0m</strong>
          </div>
        </div>

        <div class="events-header">
          <h2>Captured Videos <span id="newClipsCount">(0 new)</span></h2>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div class="capture-filters" role="tablist" aria-label="Capture filters">
          <button type="button" role="tab" aria-selected="true" data-filter="all">All</button>
          <button type="button" role="tab" aria-selected="false" data-filter="new">New</button>
          <button type="button" role="tab" aria-selected="false" data-filter="favorites">Favorites</button>
          <button type="button" role="tab" aria-selected="false" data-filter="motion">Motion</button>
          <button type="button" role="tab" aria-selected="false" data-filter="test">Test</button>
        </div>
        <div id="capturesList" class="captures-list"></div>
        <div class="storage-summary">
          <span>Used Storage:</span>
          <strong id="storageMetric">0 B</strong>
        </div>
      </aside>
    </main>

    <template id="captureTemplate">
      <article class="capture-card">
        <video controls preload="metadata"></video>
        <div>
          <h3></h3>
          <p></p>
        </div>
        <div class="capture-actions">
          <button class="favorite-button" type="button" aria-pressed="false">Favorite</button>
          <a class="download-button" aria-label="Download recording" title="Download recording">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3v12"></path>
              <path d="M7 10l5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
          </a>
          <button class="delete-button" type="button" aria-label="Delete recording" title="Delete recording">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M6 6l1 15h10l1-15"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
